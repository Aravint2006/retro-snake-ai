<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Retro Snake AI</title>
  <style>
    body {
      background: #111;
      color: #0f0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 10px;
    }

    canvas {
      background: #000;
      border: 3px solid #0f0;
    }

    .controls {
      margin-top: 10px;
    }

    button {
      background: black;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 5px 10px;
      cursor: pointer;
      font-family: monospace;
    }
  </style>
</head>
<body>

<h1>🐍 Retro Snake AI</h1>
<canvas id="game" width="400" height="400"></canvas>

<div class="controls">
  <button onclick="toggleAI()">Toggle AI Mode</button>
  <p id="status">Mode: Manual</p>
</div>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const gridSize = 20;
  const tileCount = canvas.width / gridSize;

  let snake = [{ x: 10, y: 10 }];
  let velocity = { x: 1, y: 0 };
  let food = randomFood();
  let aiMode = false;

  function toggleAI() {
    aiMode = !aiMode;
    document.getElementById("status").innerText =
      "Mode: " + (aiMode ? "AI Assist" : "Manual");
  }

  document.addEventListener("keydown", e => {
    if (aiMode) return;
    if (e.key === "ArrowUp" && velocity.y === 0) velocity = { x: 0, y: -1 };
    if (e.key === "ArrowDown" && velocity.y === 0) velocity = { x: 0, y: 1 };
    if (e.key === "ArrowLeft" && velocity.x === 0) velocity = { x: -1, y: 0 };
    if (e.key === "ArrowRight" && velocity.x === 0) velocity = { x: 1, y: 0 };
  });

  function gameLoop() {
    update();
    draw();
  }

  function update() {
    if (aiMode) velocity = aiDecision();

    const head = {
      x: snake[0].x + velocity.x,
      y: snake[0].y + velocity.y
    };

    if (collision(head)) {
      alert("Game Over");
      snake = [{ x: 10, y: 10 }];
      velocity = { x: 1, y: 0 };
      food = randomFood();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      food = randomFood();
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#0f0";
    snake.forEach(part =>
      ctx.fillRect(
        part.x * gridSize,
        part.y * gridSize,
        gridSize - 1,
        gridSize - 1
      )
    );

    ctx.fillStyle = "red";
    ctx.fillRect(
      food.x * gridSize,
      food.y * gridSize,
      gridSize - 1,
      gridSize - 1
    );
  }

  function collision(pos) {
    if (pos.x < 0 || pos.y < 0 || pos.x >= tileCount || pos.y >= tileCount)
      return true;
    return snake.some(s => s.x === pos.x && s.y === pos.y);
  }

  function randomFood() {
    return {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
  }
  function aiDecision() {
    const head = snake[0];
    const moves = [
      { x: 0, y: -1 },
      { x: 0, y: 1 },
      { x: -1, y: 0 },
      { x: 1, y: 0 }
    ];

    let bestMove = velocity;
    let shortest = Infinity;

    moves.forEach(move => {
      const next = { x: head.x + move.x, y: head.y + move.y };
      if (!collision(next)) {
        const distance =
          Math.abs(next.x - food.x) + Math.abs(next.y - food.y);
        if (distance < shortest) {
          shortest = distance;
          bestMove = move;
        }
      }
    });

    return bestMove;
  }

  setInterval(gameLoop, 120);
</script>

</body>
</html>
